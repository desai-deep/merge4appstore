name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -m 700 -p ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_DIR: ${{ secrets.SERVER_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'ENDSSH'
            set -e

            echo "Starting merge4appstore deployment..."

            if [ -z "$DEPLOY_DIR" ]; then
              echo "SERVER_DIR secret is not set"
              exit 1
            fi

            cd "$DEPLOY_DIR"

            node --version || { echo "Node.js not found"; exit 1; }
            npm --version || { echo "npm not found"; exit 1; }

            git fetch origin main
            git reset --hard origin/main

            COMMIT_SHA=$(git rev-parse --short HEAD)
            COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
            echo "Deployed commit: $COMMIT_SHA - $COMMIT_MSG"

            npm ci --omit=dev

            node --test tests/*.test.js

            # Restart (or start) the webhook server under PM2 so the new code is live.
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload merge4appstore-webhook || pm2 start server.js --name merge4appstore-webhook
              pm2 save
            else
              echo "WARNING: pm2 not found - webhook server not restarted"
            fi

            echo "merge4appstore deployment complete"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
